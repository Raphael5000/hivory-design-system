<!-- @dsCard group="Colors" viewport="700x260" subtitle="Where green is legal — contrast-checked pairings" name="Green legibility" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 14px 16px; }
  .cell { border-radius: 10px; padding: 14px; height: 86px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  .sample { font-family: var(--font-display); font-weight: 600; font-size: 19px; letter-spacing: -0.02em; }
  .meta { font-family: var(--font-mono); font-size: 9.5px; display: flex; justify-content: space-between; }
  .pass { font-weight: 600; }
</style></head>
<body>
  <div class="grid">
    <div class="cell" style="background: var(--white); border: 1px solid var(--border-subtle);">
      <span class="sample" style="color: var(--green-700);">Uncommon growth</span>
      <span class="meta" style="color: var(--text-muted);">green-700 on white <span class="pass" style="color: var(--green-700);">4.9 ✓ AA</span></span>
    </div>
    <div class="cell" style="background: var(--black);">
      <span class="sample" style="color: var(--green-500);">Uncommon growth</span>
      <span class="meta" style="color: var(--ink-400);">green-500 on black <span class="pass" style="color: var(--green-500);">12.6 ✓</span></span>
    </div>
    <div class="cell" style="background: var(--green-500);">
      <span class="sample" style="color: var(--black);">Uncommon growth</span>
      <span class="meta" style="color: var(--green-900);">black on green-500 <span class="pass">13.5 ✓</span></span>
    </div>
    <div class="cell" style="background: var(--white); border: 1px solid var(--border-subtle);">
      <span class="sample" style="color: var(--green-500);">Uncommon growth</span>
      <span class="meta" style="color: var(--text-muted);">green-500 on white <span class="pass" style="color: #C2452D;">1.6 ✗ never</span></span>
    </div>
    <div class="cell" style="background: var(--green-500);">
      <span class="sample" style="color: var(--white);">Uncommon growth</span>
      <span class="meta" style="color: var(--green-900);">white on green-500 <span class="pass" style="color: #7E2A1B;">1.6 ✗ never</span></span>
    </div>
    <div class="cell" style="background: var(--white); border: 1px solid var(--border-subtle);">
      <span class="sample" style="color: var(--green-800);">Uncommon growth</span>
      <span class="meta" style="color: var(--text-muted);">green-800 on white <span class="pass" style="color: var(--green-800);">8.2 ✓ AAA</span></span>
    </div>
  </div>
</body></html>
