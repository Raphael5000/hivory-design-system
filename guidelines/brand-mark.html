<!-- @dsCard group="Brand" viewport="700x190" subtitle="Mark-only — green, black or white; never any other color" name="Mark" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); }
  .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; padding: 16px; }
  .cell { border-radius: var(--radius-lg); display: flex; align-items: center; justify-content: center; height: 130px; }
  .cell img { height: 56px; width: auto; }
  .on-light { background: var(--white); box-shadow: inset 0 0 0 1px var(--border-subtle); }
</style></head>
<body>
  <div class="row">
    <div class="cell on-light">
      <img src="../assets/logo/hivory/mark-green.svg" alt="Mark — green">
    </div>
    <div class="cell" style="background: var(--surface-dark);">
      <img src="../assets/logo/hivory/mark-green.svg" alt="Mark — green on dark">
    </div>
    <div class="cell" style="background: var(--green-500);">
      <img src="../assets/logo/hivory/mark-black.svg" alt="Mark — black on green">
    </div>
  </div>
</body></html>
