<!-- @dsCard group="Brand" viewport="700x210" subtitle="How sub-brands work — shared mark, themed scope, dark-first" name="Sub-brand: Meaning" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .panel { border-radius: var(--radius-lg); padding: 18px; min-height: 120px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .panel img { height: 26px; width: auto; align-self: flex-start; }
  h2 { margin: 0; font-family: var(--font-display); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); font-size: 20px; }
  .tok { font-size: 9.5px; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
</style></head>
<body>
  <div class="row">
    <div class="panel" style="background: var(--white);">
      <img src="../assets/logo/hivory/black-green.svg" alt="Hivory">
      <h2 style="color: var(--text-display);">Light-first. <span style="color: var(--text-brand);">Green</span> accents.</h2>
      <span class="tok" style="color: var(--text-muted);">:root — parent brand</span>
    </div>
    <div class="panel" data-brand="meaning" style="background: var(--surface-page);">
      <img src="../assets/logo/meaning/green-white.svg" alt="Meaning">
      <h2 style="color: var(--text-display);">Dark-first. Shared mark.</h2>
      <span class="tok" style="color: var(--text-muted);">[data-brand="meaning"] — themed scope</span>
    </div>
  </div>
</body></html>
