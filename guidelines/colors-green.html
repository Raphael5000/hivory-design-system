<!-- @dsCard group="Colors" viewport="700x160" subtitle="Brand green ramp — 500 #00EE7F is a fill, never text on white; 600 re-tuned to #00A352" name="Hivory green" --><!-- drift-ok: hex quoted as documentation label, not a style value -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-body); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; padding: 14px 16px; }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { height: 80px; border-radius: var(--radius-sm); box-shadow: inset 0 0 0 1px var(--border-subtle); }
  .lbl { font-size: 8.5px; font-variant-numeric: tabular-nums; color: var(--text-muted); text-align: center; }
  .lbl b { color: var(--text-body); font-weight: 500; display: block; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background: var(--green-50);"></div><span class="lbl"><b>50</b>wash</span></div>
    <div class="sw"><div class="chip" style="background: var(--green-100);"></div><span class="lbl"><b>100</b></span></div>
    <div class="sw"><div class="chip" style="background: var(--green-200);"></div><span class="lbl"><b>200</b></span></div>
    <div class="sw"><div class="chip" style="background: var(--green-300);"></div><span class="lbl"><b>300</b></span></div>
    <div class="sw"><div class="chip" style="background: var(--green-400);"></div><span class="lbl"><b>400</b></span></div>
    <div class="sw"><div class="chip" style="background: var(--green-500); outline: 2px solid var(--ink-950); outline-offset: 2px;"></div><span class="lbl"><b>500 ★</b>fill only</span></div>
    <div class="sw"><div class="chip" style="background: var(--green-600);"></div><span class="lbl"><b>600</b>large/icons</span></div>
    <div class="sw"><div class="chip" style="background: var(--green-700);"></div><span class="lbl"><b>700</b>AA text</span></div>
    <div class="sw"><div class="chip" style="background: var(--green-800);"></div><span class="lbl"><b>800</b>AAA text</span></div>
    <div class="sw"><div class="chip" style="background: var(--green-900);"></div><span class="lbl"><b>900</b></span></div>
  </div>
</body></html>
