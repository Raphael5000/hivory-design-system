<!-- @dsCard group="Colors" viewport="700x210" subtitle="The foundation — cool-grey ink carries everything; the canvas stays neutral; green is the one signal" name="Black & white foundation" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-body); }
  .wrap { padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; }
  .strip { display: grid; grid-template-columns: 5fr 5fr 1.6fr; gap: 10px; }
  .panel { border-radius: var(--radius-control); padding: 16px; height: 118px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between; }
  h2 { margin: 0; font-family: var(--font-display); font-weight: 600; font-size: 21px; letter-spacing: -0.02em; }
  .tok { font-size: 9.5px; font-variant-numeric: tabular-nums; }
  .law { font-size: 10.5px; color: var(--text-muted); }
</style></head>
<body>
  <div class="wrap">
    <div class="strip">
      <div class="panel" style="background: var(--white); box-shadow: inset 0 0 0 1px var(--border-subtle);">
        <h2 style="color: var(--text-display);">Light surfaces.<br>Ink type.</h2>
        <span class="tok" style="color: var(--text-muted);">--surface-page · --text-display</span>
      </div>
      <div class="panel" style="background: var(--surface-dark);">
        <h2 style="color: var(--text-on-dark);">Dark surfaces.<br>White type.</h2>
        <span class="tok" style="color: var(--text-muted-on-dark);">--surface-dark · --text-on-dark</span>
      </div>
      <div class="panel" style="background: var(--green-500);">
        <h2 style="color: var(--text-on-green);">Signal.</h2>
        <span class="tok" style="color: var(--green-900);">green-500</span>
      </div>
    </div>
    <p class="law" style="margin: 0;">The platform canvas stays neutral cool grey on purpose — the client's brand is the hero, and the console never competes with it.</p>
  </div>
</body></html>
