<!-- @dsCard group="Colors" viewport="700x160" subtitle="Pure neutral grays — the black & white platform scale" name="Neutrals" -->
<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; font-family: var(--font-mono); background: var(--surface-page); }
  .row { display: grid; grid-template-columns: repeat(9, 1fr); gap: 6px; padding: 14px 16px; }
  .sw { display: flex; flex-direction: column; gap: 5px; }
  .chip { height: 84px; border-radius: 8px; border: 1px solid var(--border-subtle); }
  .lbl { font-size: 9.5px; color: var(--text-muted); text-align: center; }
  .lbl b { color: var(--text-body); font-weight: 500; display: block; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background: var(--ink-950);"></div><span class="lbl"><b>950</b>display</span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-900);"></div><span class="lbl"><b>900</b>body</span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-700);"></div><span class="lbl"><b>700</b></span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-500);"></div><span class="lbl"><b>500</b>muted</span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-400);"></div><span class="lbl"><b>400</b>faint</span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-300);"></div><span class="lbl"><b>300</b></span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-200);"></div><span class="lbl"><b>200</b>border</span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-100);"></div><span class="lbl"><b>100</b>border</span></div>
    <div class="sw"><div class="chip" style="background: var(--ink-50);"></div><span class="lbl"><b>50</b>sunken</span></div>
  </div>
</body></html>
