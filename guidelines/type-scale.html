<!DOCTYPE html>
<html><head><link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; background: var(--surface-page); color: var(--text-display); padding: 14px 24px; }
  .row { display: flex; align-items: baseline; gap: 16px; padding: 3px 0; }
  .tok { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-muted); width: 110px; flex: none; }
  .sample { font-family: var(--font-display); font-weight: 600; letter-spacing: var(--tracking-display); white-space: nowrap; }
</style></head>
<body>
  <div class="row"><span class="tok">--text-5xl · 64</span><span class="sample" style="font-size: var(--text-5xl);">Grow</span></div>
  <div class="row"><span class="tok">--text-4xl · 48</span><span class="sample" style="font-size: var(--text-4xl);">Growth</span></div>
  <div class="row"><span class="tok">--text-3xl · 36</span><span class="sample" style="font-size: var(--text-3xl);">Growth engine</span></div>
  <div class="row"><span class="tok">--text-2xl · 28</span><span class="sample" style="font-size: var(--text-2xl);">Growth engine</span></div>
  <div class="row"><span class="tok">--text-xl · 22</span><span class="sample" style="font-size: var(--text-xl);">Growth engine</span></div>
  <div class="row"><span class="tok">--text-lg · 18</span><span class="sample" style="font-size: var(--text-lg); font-family: var(--font-body); font-weight: 500; letter-spacing: 0;">Growth engine for teams</span></div>
  <div class="row"><span class="tok">--text-base · 15</span><span class="sample" style="font-size: var(--text-base); font-family: var(--font-body); font-weight: 400; letter-spacing: 0;">Growth engine for teams</span></div>
  <div class="row"><span class="tok">--text-sm · 13.5</span><span class="sample" style="font-size: var(--text-sm); font-family: var(--font-body); font-weight: 400; letter-spacing: 0;">Growth engine for teams</span></div>
  <div class="row"><span class="tok">--text-xs · 12</span><span class="sample" style="font-size: var(--text-xs); font-family: var(--font-body); font-weight: 500; letter-spacing: var(--tracking-caps); text-transform: uppercase;">Label</span></div>
</body></html>
