<!-- @dsCard group="Components" viewport="700x300" name="StepTimeline" subtitle="A machine reporting on itself — running, arrived, failed; nothing to click, one honest clock" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { padding: 20px; display: grid; grid-template-columns: 1.2fr 1fr 1fr; gap: 20px; align-items: start; }
  .blk { display: flex; flex-direction: column; gap: 12px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); }
  .hint { font-size: 11px; line-height: 1.55; color: var(--text-secondary); }
</style>
</head><body>
<div id="root"></div>
<script>
const e = React.createElement;
const { StepTimeline } = window.HivoryDesignSystem_354905;

const PHASES = ['Build', 'Deploy', 'Verify'];
const LABELS = ['Building', 'Deploying to staging', 'Verifying'];

function Live() {
  const [t, setT] = React.useState(0);
  React.useEffect(() => {
    const id = setInterval(() => setT((s) => (s + 1) % 16), 1000);
    return () => clearInterval(id);
  }, []);
  const idx = t < 4 ? 0 : t < 8 ? 1 : t < 12 ? 2 : 3;
  if (idx > 2) {
    return e(StepTimeline, { phases: PHASES, arrived: { title: 'Live on staging', meta: 'Built and verified in 12s' } });
  }
  return e(StepTimeline, { phases: PHASES, active: idx, label: LABELS[idx], elapsed: t + 's' });
}

ReactDOM.createRoot(document.getElementById('root')).render(
  e('div', { className: 'wrap' },
    e('div', { className: 'blk' },
      e('span', { className: 'cap' }, 'running · loops to arrival'),
      e(Live),
      e('div', { className: 'hint' }, 'One active pulse, connectors tint as phases pass, elapsed counts up. Never a percentage.')
    ),
    e('div', { className: 'blk' },
      e('span', { className: 'cap' }, 'arrived · rail replaced'),
      e(StepTimeline, { phases: PHASES, arrived: { title: 'Live on staging', meta: 'Built and verified in 41s' } }),
      e('div', { className: 'hint' }, 'The outcome states itself — never three green checks left on screen.')
    ),
    e('div', { className: 'blk' },
      e('span', { className: 'cap' }, 'failed · stops where it broke'),
      e(StepTimeline, { phases: PHASES, active: 1, failed: true, label: 'Deploy failed', mark: false }),
      e('div', { className: 'hint' }, 'The failed node goes red, later phases stay hollow. It never rewinds to zero.')
    )
  )
);
</script>
</body></html>
