<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-sans)}</style>
</head><body>
<div id="root"></div>
<script>
const e = React.createElement;
const { FilterSelect } = window.HivoryDesignSystem_354905;
ReactDOM.createRoot(document.getElementById('root')).render(
  e('div', { style: { padding: '16px 20px', display: 'flex', gap: '12px', alignItems: 'flex-start', flexWrap: 'wrap' } },
    // Selected + open: ink-filled trigger tallies the picks; tone dots; Clear row below the hairline
    e(FilterSelect, {
      label: 'Status',
      defaultOpen: true,
      defaultValue: ['review', 'progress'],
      options: [
        { id: 'review', label: 'For review', tone: 'caution' },
        { id: 'progress', label: 'In progress', tone: 'positive' },
        { id: 'done', label: 'Completed', tone: 'neutral' }
      ]
    }),
    // Rest: the trigger says the dimension, nothing more
    e(FilterSelect, {
      label: 'Channel',
      options: [
        { id: 'blog', label: 'Blog' },
        { id: 'linkedin', label: 'LinkedIn' },
        { id: 'website', label: 'Website' },
        { id: 'pipeline', label: 'Pipeline' },
        { id: 'email', label: 'Email' }
      ]
    }),
    // Disabled (spec-strip parity — normally an empty dimension is simply not rendered)
    e(FilterSelect, { label: 'Owner', disabled: true, options: [] }),
    // Empty: a --text-faint row saying no options match
    e(FilterSelect, { label: 'Region', defaultOpen: true, options: [], emptyText: 'No options match' })
  )
);
</script>
</body></html>
