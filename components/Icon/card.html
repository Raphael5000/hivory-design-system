<!-- @dsCard group="Components" viewport="700x360" name="Icon" subtitle="Custom Hivory set — hexagon signature from the mark, 1.5px round strokes, 16px grid" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-body); }
  .wrap { padding: 16px 20px 18px; }
  .grid { display: grid; grid-template-columns: repeat(10, 1fr); gap: 7px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 11px 2px 8px; box-shadow: inset 0 0 0 1px var(--border-subtle); border-radius: var(--radius-sm); color: var(--text-muted); }
  .cell span { font-family: var(--font-mono); font-size: 8.5px; color: var(--text-faint); }
  .below { display: flex; gap: 14px; margin-top: 12px; align-items: stretch; }
  .ctx { flex: none; width: 186px; box-shadow: inset 0 0 0 1px var(--border-subtle); border-radius: var(--radius-md); padding: 7px; display: flex; flex-direction: column; gap: 2px; }
  .nitem { position: relative; display: flex; align-items: center; gap: 10px; padding: 6px 10px; border-radius: var(--radius-sm); font-size: 13px; color: var(--ink-900); }
  .nitem--active { background: var(--ink-50); font-weight: 600; color: var(--ink-950); }
  .nitem--active::before { content: ""; position: absolute; left: 0; top: 5px; bottom: 5px; width: 2px; border-radius: 2px; background: var(--ink-950); }
  .nitem .ico { color: var(--text-muted); display: inline-flex; }
  .nitem--active .ico { color: var(--ink-950); }
  .rules { flex: 1; font-size: 12px; color: var(--text-muted); line-height: 1.55; }
  .rules b { color: var(--ink-900); font-weight: 600; }
</style>
</head><body>
<div class="wrap">
  <div class="grid" id="grid"></div>
  <div class="below">
    <div class="ctx" id="ctx"></div>
    <div class="rules"><b>Grammar:</b> 16px grid, 1.5px even stroke, round caps + joins, no fills. <b>Signature:</b> the hexagon from the mark replaces generic squares/circles — dashboard's fourth tile, the agent's body. Diagonals prefer the hexagon's 60° family. <b>Color:</b> <code>text-muted</code> rest → <code>ink-950</code> active → <code>ink-200</code> disabled. Never green.</div>
  </div>
</div>
<script>
const e = React.createElement;
const { Icon, ICON_NAMES } = window.HivoryDesignSystem_354905;
ReactDOM.createRoot(document.getElementById('grid')).render(
  e(React.Fragment, null, ICON_NAMES.map((n) =>
    e('div', { className: 'cell', key: n }, e(Icon, { name: n }), e('span', null, n))
  ))
);
ReactDOM.createRoot(document.getElementById('ctx')).render(
  e(React.Fragment, null,
    e('div', { className: 'nitem' }, e('span', { className: 'ico' }, e(Icon, { name: 'dashboard', size: 14 })), 'Dashboard'),
    e('div', { className: 'nitem nitem--active' }, e('span', { className: 'ico' }, e(Icon, { name: 'pipeline', size: 14 })), 'Pipeline'),
    e('div', { className: 'nitem' }, e('span', { className: 'ico' }, e(Icon, { name: 'agent', size: 14 })), 'Agents')
  )
);
</script>
</body></html>
