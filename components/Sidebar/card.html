      { id: 'pipeline', label: 'Pipeline', icon: e(SidebarIcon, { name: 'pipeline' }) }

    { key: 'agents', label: 'Agents', items: [

      { id: 'proposal', label: 'Q4 Growth Proposal', icon: e(SidebarIcon, { name: 'doc' }), pill: 'Review', pillTone: 'caution' }

      activeId: active,
      onNavigate: setActive
