<!-- @dsCard group="Components" viewport="700x640" name="Gantt" subtitle="Staircase of ink bars on a week grid — 38px lane pitch, bars are real buttons, ink-950 selection, detail region is the consumer's" -->
<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-sans)}</style>
</head><body>
<div id="root"></div>
<script>
const e = React.createElement;
const { Gantt, Card } = window.HivoryDesignSystem_354905;

const phases = [
  { label: 'Knowledge & onboarding', start: 1, end: 1, range: 'Week 1' },
  { label: 'First drafts, held', start: 2, end: 3, range: 'Weeks 2–3' },
  { label: 'First publishes', start: 3, end: 4, range: 'Weeks 3–4' },
  { label: 'Steady state', start: 5, end: 8, range: 'Weeks 5–8 →' }
];

const label = (t) => e('div', { style: { fontSize: '11px', fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-faint)', marginBottom: '8px' } }, t);

function Demo() {
  const [sel, setSel] = React.useState(1);
  return e('div', { style: { display: 'grid', gap: '20px' } },
    e(Card, null,
      e(Gantt, { phases: phases, weeks: 8, selected: sel, onSelect: (i) => setSel(i) }),
      e('div', { style: { marginTop: '12px', fontSize: '12px', color: 'var(--text-muted)', fontVariantNumeric: 'tabular-nums' } },
        'Selected — ' + phases[sel].label + ' · ' + phases[sel].range + ' (the detail region is the consumer’s job, driven by onSelect)')
    ),
    e('div', { style: { display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', alignItems: 'start' } },
      e(Card, null,
        label('Loading — shimmer at the real geometry'),
        e(Gantt, { loading: true, weeks: 8 })
      ),
      e(Card, null,
        label('Empty — a statement, not a frame'),
        e(Gantt, { phases: [] })
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  e('div', { style: { padding: '18px' } }, e(Demo))
);
</script>
</body></html>
