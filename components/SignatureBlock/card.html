<!DOCTYPE html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-sans)}</style>
</head><body>
<div id="root"></div>
<script>
const e = React.createElement;
const { SignatureBlock, Card } = window.HivoryDesignSystem_354905;

const summary = [
  { label: 'Package', value: 'Full engine · $8,500/mo' },
  { label: 'Start', value: 'Monday 3 August 2026' },
  { label: 'Your partner', value: 'Dan Cohen, Hivory' }
];

const label = (t) => e('div', { style: { fontSize: '11px', fontWeight: 600, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-faint)', marginBottom: '8px' } }, t);

ReactDOM.createRoot(document.getElementById('root')).render(
  e('div', { style: { padding: '18px', display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '20px', alignItems: 'start' } },
    e(Card, null,
      label('Blank — type to sign (live)'),
      e(SignatureBlock, {
        summary: summary,
        authLabel: 'I’m authorized to sign for Pure Good',
        ctaLabel: 'Sign & accept — Full engine',
        note: 'Signing starts onboarding — no payment is taken today.',
        signedLabel: 'Signed · Full engine',
        onSign: function (name) {
          console.log('signed by ' + name);
        }
      })
    ),
    e(Card, null,
      label('Signed — the receipt, in past tense'),
      e(SignatureBlock, {
        summary: summary,
        name: 'Maya Osei',
        authorized: true,
        signed: true,
        authLabel: 'I’m authorized to sign for Pure Good',
        ctaLabel: 'Sign & accept — Full engine',
        signedLabel: 'Signed · Full engine',
        signedNote: '✓ Signed by Maya Osei · 31 Jul 2026 · Full engine · $8,500/mo'
      })
    )
  )
);
</script>
