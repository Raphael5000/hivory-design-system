<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Hivory Email Template Audit</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #0A0A0A; color: #E5E5E5; }

    .header {
      padding: 40px 48px 32px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; }
    .header .count { font-size: 13px; color: #666; }

    .toggle-bar {
      display: flex;
      gap: 0;
      padding: 0 48px;
      border-bottom: 1px solid #222;
      background: #111;
    }
    .toggle-bar button {
      background: none;
      border: none;
      color: #666;
      font-size: 12px;
      font-weight: 600;
      padding: 12px 20px;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .toggle-bar button:hover { color: #aaa; }
    .toggle-bar button.active { color: #fff; border-bottom-color: #00B25D; }

    .nav {
      display: flex;
      gap: 0;
      padding: 0 48px;
      border-bottom: 1px solid #222;
      overflow-x: auto;
    }
    .nav button {
      background: none;
      border: none;
      color: #888;
      font-size: 12px;
      font-weight: 500;
      padding: 14px 16px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .nav button:hover { color: #ccc; }
    .nav button.active { color: #fff; border-bottom-color: #fff; }

    .nav-repo {
      display: flex;
      gap: 0;
      padding: 0 48px;
      background: #0f0f0f;
      border-bottom: 1px solid #222;
    }
    .nav-repo button {
      background: none;
      border: none;
      color: #666;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 16px;
      cursor: pointer;
      white-space: nowrap;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .nav-repo button:hover { color: #aaa; }
    .nav-repo button.active { color: #fff; border-bottom-color: #00B25D; }

    .compare-area {
      display: none;
      padding: 40px 48px;
      gap: 32px;
    }
    .compare-area.active { display: flex; justify-content: center; }
    .compare-area.side-by-side { display: flex; justify-content: center; }

    .compare-col { flex: 1; max-width: 640px; }
    .compare-col .col-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #666;
      margin-bottom: 12px;
      text-align: center;
    }
    .compare-col .col-label.old { color: #f87171; }
    .compare-col .col-label.new { color: #4ade80; }

    .preview-area {
      display: flex;
      justify-content: center;
      padding: 40px 48px;
      min-height: calc(100vh - 200px);
    }

    .email-frame {
      width: 100%;
      max-width: 640px;
      background: #F4F3F0;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 24px 80px rgba(0,0,0,0.5);
    }

    .email-meta {
      display: flex;
      gap: 32px;
      padding: 20px 48px;
      background: #111;
      border-bottom: 1px solid #222;
      font-size: 12px;
    }
    .email-meta dl { min-width: 0; }
    .email-meta dt { color: #666; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 2px; }
    .email-meta dd { color: #ccc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .email-content iframe {
      width: 100%;
      border: none;
      min-height: 600px;
    }

    .changes-bar {
      padding: 16px 48px;
      background: #0d1a0d;
      border-bottom: 1px solid #1a3a1a;
      display: none;
    }
    .changes-bar.active { display: block; }
    .changes-bar h3 { font-size: 12px; font-weight: 600; color: #4ade80; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .changes-bar ul { list-style: none; display: flex; flex-wrap: wrap; gap: 8px; }
    .changes-bar li {
      font-size: 12px;
      color: #86efac;
      background: #0a200a;
      padding: 4px 10px;
      border-radius: 100px;
      border: 1px solid #1a3a1a;
    }
  </style>
</head>
<body>

<div class="header">
  <h1>Email Template Audit</h1>
  <span class="count">15 templates across 4 repos &middot; Unified shell</span>
</div>

<div class="toggle-bar" id="viewToggle">
  <button class="active" data-view="unified">Unified</button>
  <button data-view="compare">Before / After</button>
</div>

<div class="nav-repo" id="repoNav">
  <button class="active" data-repo="all">All</button>
  <button data-repo="website">Hivory Website</button>
  <button data-repo="portal">Client Portal</button>
  <button data-repo="agents">Managed Agents</button>
  <button data-repo="meaning">Meaning</button>
</div>

<div class="nav" id="templateNav"></div>

<div class="email-meta" id="emailMeta">
  <dl><dt>Repo</dt><dd id="metaRepo">&mdash;</dd></dl>
  <dl><dt>Subject</dt><dd id="metaSubject">&mdash;</dd></dl>
  <dl><dt>Audience</dt><dd id="metaAudience">&mdash;</dd></dl>
  <dl><dt>Source</dt><dd id="metaFile">&mdash;</dd></dl>
</div>

<div class="changes-bar" id="changesBar">
  <h3>Changes applied</h3>
  <ul id="changesList"></ul>
</div>

<!-- Single view -->
<div class="preview-area" id="singleView">
  <div class="email-frame">
    <div class="email-content">
      <iframe id="emailPreview" sandbox="allow-same-origin"></iframe>
    </div>
  </div>
</div>

<!-- Compare view -->
<div class="compare-area" id="compareView">
  <div class="compare-col">
    <div class="col-label old">Before (Original)</div>
    <div class="email-frame">
      <div class="email-content">
        <iframe id="emailBefore" sandbox="allow-same-origin"></iframe>
      </div>
    </div>
  </div>
  <div class="compare-col">
    <div class="col-label new">After (Unified)</div>
    <div class="email-frame">
      <div class="email-content">
        <iframe id="emailAfter" sandbox="allow-same-origin"></iframe>
      </div>
    </div>
  </div>
</div>

function shell(body, opts = {}) {
  const headerBg = opts.headerBg || '';
  const headerContent = opts.headerContent || '';
  const hasColorHeader = !!headerBg;
  const platform = opts.platform || 'hivory.io';

  const platformLabel = platform.replace(/^https?:\/\//, '');
  const logoUrl = opts.logo || HIVORY_LOGO_URL;
  const logoAlt = opts.logoAlt || 'Hivory';
  const footerText = opts.footerText || 'Hivory &middot; Watershed, 17 Dock Road, V&amp;A Waterfront, Cape Town';

  return `<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/></head>

    <tr><td align="center" style="padding:40px 16px;">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#FFFFFF;border-radius:12px;overflow:hidden;">
        <!-- Logo -->
        <tr>
          <td style="padding:32px 40px 24px 40px;border-bottom:1px solid #E5E4E1;">
            <img src="${logoUrl}" alt="${logoAlt}" width="120" style="display:block;height:auto;" />
          </td>
        </tr>
        ${hasColorHeader ? `<!-- Status header -->
        <tr>
          <td style="padding:20px 40px;background-color:${headerBg};color:#ffffff;">
            <h1 style="margin:0;font-size:18px;font-weight:600;">${headerContent}</h1>
          </td>
        </tr>` : ''}
        <!-- Body -->
        <tr>
          <td style="padding:36px 40px 40px 40px;">
            ${body}
          </td>
        </tr>
        <!-- Footer -->
        <tr>
          <td style="padding:24px 40px;background-color:#FAFAF8;border-top:1px solid #E5E4E1;">
            <p style="margin:0;font-size:12px;line-height:1.6;color:#9A9A9A;">
              ${footerText}
            </p>
            <p style="margin:6px 0 0 0;">
              <a href="${platformUrl}" style="font-size:12px;color:#9A9A9A;text-decoration:underline;">${platformLabel}</a>
            </p>
          </td>
        </tr>
      </table>
    </td></tr>
  </table>
</body>
</html>`;
}

function field(label, value, opts = {}) {
  const valueHtml = opts.link
    ? `<a href="${opts.link}" style="color:#1A1A1A;text-decoration:underline;">${value}</a>`
    : value;
  return `<tr>
    <td style="padding:10px 16px 10px 0;vertical-align:top;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#9A9A9A;white-space:nowrap;">${label}</td>
    <td style="padding:10px 0;font-size:14px;color:#1A1A1A;">${valueHtml}</td>
  </tr>`;
}

function btn(label, href) {
  return `<a href="${href || '#'}" style="display:inline-block;padding:10px 24px;background-color:#1A1A1A;color:#FFFFFF;font-size:13px;font-weight:600;text-decoration:none;border-radius:100px;">${label}</a>`;
}

function sectionLabel(text) {
  return `<p style="margin:0 0 4px 0;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#9A9A9A;">${text}</p>`;
}

function infoBox(content) {
  return `<div style="padding:16px 20px;background-color:#FAFAF8;border-radius:8px;border:1px solid #E5E4E1;">
    ${content}
  </div>`;
}

function detailBlock(label, value) {
  return `<p style="font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:#9A9A9A;margin:0 0 4px 0;">${label}</p>
  <p style="font-size:15px;font-weight:500;color:#1A1A1A;margin:0 0 16px 0;">${value}</p>`;
}

// ─── UI Logic ─────────────────────────────────────────────────

const nav = document.getElementById('templateNav');
const repoNav = document.getElementById('repoNav');
const viewToggle = document.getElementById('viewToggle');
const singleView = document.getElementById('singleView');
const compareView = document.getElementById('compareView');
const changesBar = document.getElementById('changesBar');
const changesList = document.getElementById('changesList');

let activeRepo = 'all';
let activeTemplate = null;
let viewMode = 'unified'; // 'unified' or 'compare'

function getVisibleTemplates() {
  return activeRepo === 'all' ? templates : templates.filter(t => t.repo === activeRepo);
}

function renderNav() {
  const visible = getVisibleTemplates();
  nav.innerHTML = '';
  visible.forEach((t, i) => {
    const b = document.createElement('button');
    b.textContent = t.name;
    b.dataset.id = t.id;
    if (activeTemplate && activeTemplate.id === t.id) b.classList.add('active');
    else if (!activeTemplate && i === 0) b.classList.add('active');
    b.addEventListener('click', () => selectTemplate(t.id));
    nav.appendChild(b);
  });
  if (!activeTemplate || !visible.find(v => v.id === activeTemplate.id)) {
    if (visible.length > 0) selectTemplate(visible[0].id);
  }
}

function renderIframe(iframe, html) {
  const doc = iframe.contentDocument || iframe.contentWindow.document;
  doc.open();
  doc.write(html);
  doc.close();
  setTimeout(() => { iframe.style.height = doc.body.scrollHeight + 40 + 'px'; }, 100);
}

function selectTemplate(id) {
  const t = templates.find(x => x.id === id);
  if (!t) return;
  activeTemplate = t;

  nav.querySelectorAll('button').forEach(b => b.classList.toggle('active', b.dataset.id === id));

  const repoLabels = { website: 'Hivory Website', portal: 'Client Portal', agents: 'Managed Agents', meaning: 'Meaning' };
  document.getElementById('metaRepo').textContent = repoLabels[t.repo];
  document.getElementById('metaSubject').textContent = t.subject;
  document.getElementById('metaAudience').textContent = t.audience;
  document.getElementById('metaFile').textContent = t.file;

  // Changes bar
  const hasChanges = t.original !== null;
  changesBar.classList.toggle('active', hasChanges && viewMode === 'unified');
  if (hasChanges) {
    changesList.innerHTML = t.changes.map(c => `<li>${c}</li>`).join('');
  }

  if (viewMode === 'unified') {
    singleView.style.display = 'flex';
    compareView.style.display = 'none';
    renderIframe(document.getElementById('emailPreview'), t.unified);
  } else {
    singleView.style.display = 'none';
    compareView.style.display = 'flex';
    compareView.classList.add('active');
    renderIframe(document.getElementById('emailBefore'), t.original || t.unified);
    renderIframe(document.getElementById('emailAfter'), t.unified);
  }
}

// View toggle
viewToggle.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    viewMode = b.dataset.view;
    viewToggle.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    if (activeTemplate) selectTemplate(activeTemplate.id);
  });
});

// Repo filter
repoNav.querySelectorAll('button').forEach(b => {
  b.addEventListener('click', () => {
    activeRepo = b.dataset.repo;
    repoNav.querySelectorAll('button').forEach(x => x.classList.toggle('active', x === b));
    activeTemplate = null;
    renderNav();
  });
});

renderNav();
</script>

</body>
</html>
